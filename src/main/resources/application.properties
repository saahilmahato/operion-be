spring.application.name=operion
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

jwt.issuer=http://localhost:8080
jwt.key-id=operion-2026-09
jwt.access-token-ttl=15m
jwt.public-key=classpath:certs/public.pem
jwt.private-key=file:${JWT_PRIVATE_KEY_PATH}
jwt.cookie-name=access_token
jwt.cookie-secure=false

app.cors.allowed-origins=http://localhost:5173,https://operion.com